name: Release

# A vX.Y.Z tag builds the .vsix, runs the Electron smoke test, and attaches the
# .vsix with SHA256SUMS to a GitHub Release. The publish job then publishes to the
# VS Code Marketplace and Open VSX from the protected environment "marketplace"
# (required reviewer: the owner), but only for the registries whose repository
# variable is "true" (PUBLISH_MARKETPLACE, PUBLISH_OPENVSX). Until the owner has set
# up those accounts, the variables stay unset and a release only builds and attaches.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then echo "tag $GITHUB_REF_NAME but package.json says $version"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Package the .vsix
        id: pack
        run: |
          vsix="cloudpin-${GITHUB_REF_NAME#v}.vsix"
          npx vsce package --out "$vsix"
          npx vsce ls
          sha256sum "$vsix" > SHA256SUMS
          cat SHA256SUMS
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            ${{ steps.pack.outputs.vsix }}
            SHA256SUMS
          if-no-files-found: error

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:smoke

  # Only this job can write to the repository, and only to create the release.
  github-release:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Outside the checkout, so nothing from the repository is attached by mistake.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The CHANGELOG section for this version, without its heading.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## \[/ { on = 0 } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release-assets/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md

  # Present from the start, but it runs only once the owner sets PUBLISH_MARKETPLACE
  # and/or PUBLISH_OPENVSX to "true" (Settings > Secrets and variables > Actions >
  # Variables), after creating the publisher accounts (docs/design.md, "CI and release").
  # The environment "marketplace" must exist, with the owner as required reviewer and
  # deployments limited to v* tags, BEFORE either variable is set: a job that names an
  # environment that doesn't exist gets a new one created with no protection rules.
  publish:
    needs: github-release
    if: vars.PUBLISH_MARKETPLACE == 'true' || vars.PUBLISH_OPENVSX == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # vsce at the version in the lockfile; no install scripts are needed to publish.
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Check the .vsix against SHA256SUMS
        working-directory: ${{ runner.temp }}/release-assets
        run: sha256sum --check SHA256SUMS

      # VS Code Marketplace. Azure DevOps global PATs retire on 2026-12-01, so no PAT:
      # vsce 4.0.0 has no --oidc flag (checked with `vsce publish --help`, 2026-10-18), so
      # this uses --azure-credential with a Microsoft Entra workload identity federated
      # to this workflow and environment (azure/login, OIDC).
      # UNVERIFIED: the Entra app registration, its federated credential for
      # environment "marketplace", and that identity's rights on the paureis publisher
      # are not set up yet; nothing here has run. Variables AZURE_CLIENT_ID and
      # AZURE_TENANT_ID hold the app's IDs (not secrets).
      - name: Azure login (workload identity)
        if: vars.PUBLISH_MARKETPLACE == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish to the VS Code Marketplace
        if: vars.PUBLISH_MARKETPLACE == 'true'
        run: npx vsce publish --azure-credential --packagePath "$RUNNER_TEMP"/release-assets/*.vsix

      # Open VSX. The first version needs an access token (environment secret
      # OVSX_PAT, read by ovsx from the environment, never on the command line);
      # after that, trusted publishing bound to this workflow and environment, and
      # the token is deleted.
      # UNVERIFIED: the open-vsx.org namespace, the token, and the exact
      # trusted-publishing flag of ovsx (written here as --trusted-publishing, per
      # docs/design.md) have not been checked against a real publish. ovsx is pinned
      # to an exact version older than two weeks, but npx resolves its own
      # dependencies without a lockfile.
      - name: Publish to Open VSX
        if: vars.PUBLISH_OPENVSX == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          vsix="$(ls "$RUNNER_TEMP"/release-assets/*.vsix)"
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx@1.2.0 publish "$vsix"
          else
            npx --yes ovsx@1.2.0 publish "$vsix" --trusted-publishing
          fi
